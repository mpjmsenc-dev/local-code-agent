name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: ShellCheck + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: bash -n (syntax) on every script
        run: |
          for f in *.sh scripts/*.sh deploy/*.sh tests/*.sh bin/* .githooks/*; do
            bash -n "$f"
          done
      - name: shellcheck (zero findings required)
        run: shellcheck -x -P SCRIPTDIR *.sh scripts/*.sh deploy/*.sh tests/*.sh bin/* .githooks/*

  test:
    name: Unit tests + tune dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Library + tune-ladder unit tests
        run: bash tests/test-lib.sh
      - name: tune.sh --dry-run exits 0 and changes nothing
        shell: bash
        run: |
          set -euo pipefail
          out="$(bash scripts/tune.sh --dry-run 2>&1)"
          printf '%s\n' "${out}"
          test -f .env && diff .env .env.example
          # --dry-run promises to change nothing, and loading a model into RAM
          # is a change to the machine's state — the one thing the flag exists
          # to avoid. Captured, not piped, for the SIGPIPE reason in
          # CONTRIBUTING.md.
          if grep -qi 'warming' <<<"${out}"; then
            echo "FAIL: --dry-run warmed the model; it must change nothing"; exit 1
          fi
      - name: update.sh --check detects updates without applying them
        # Updating is the second thing every user does after installing, and it
        # had no coverage at all. --check is the whole detection path — branch
        # resolution, fetch, behind-count, local-edit warning — with nothing
        # mutated, so it can be gated cheaply on every push.
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.email ci@example.invalid
          git config --global user.name CI
          git config --global --add safe.directory "$(pwd)"
          # A PR build is a DETACHED merge commit and update.sh rightly refuses
          # those, so the fixture needs a real branch on both ends.
          BR=ci-update-test
          git branch -f "${BR}" HEAD
          git clone --quiet --bare . /tmp/upd-origin.git
          git -C /tmp/upd-origin.git symbolic-ref HEAD "refs/heads/${BR}"
          git clone --quiet /tmp/upd-origin.git /tmp/upd-work
          cp .env.example /tmp/upd-work/.env

          out="$(cd /tmp/upd-work && ./update.sh --check 2>&1)"
          printf '%s\n' "${out}"
          grep -q 'Already up to date' <<<"${out}" \
            || { echo "FAIL: a fresh clone should be up to date"; exit 1; }

          # Advance the remote; --check must SEE it and must NOT apply it.
          git clone --quiet /tmp/upd-origin.git /tmp/upd-push
          ( cd /tmp/upd-push
            echo "# upstream change" >> README.md
            git commit --quiet -am "upstream: a change update.sh must notice"
            git push --quiet origin "${BR}" )
          before="$(git -C /tmp/upd-work rev-parse HEAD)"
          out="$(cd /tmp/upd-work && ./update.sh --check 2>&1)"
          printf '%s\n' "${out}"
          grep -q '1 new commit' <<<"${out}" \
            || { echo "FAIL: --check did not report the new commit"; exit 1; }
          grep -q 'nothing was changed' <<<"${out}" \
            || { echo "FAIL: --check did not say it changed nothing"; exit 1; }
          test "$(git -C /tmp/upd-work rev-parse HEAD)" = "${before}" \
            || { echo "FAIL: --check moved HEAD; it must not touch the checkout"; exit 1; }

          # Local edits must be surfaced before anything is applied.
          echo "local tweak" >> /tmp/upd-work/README.md
          out="$(cd /tmp/upd-work && ./update.sh --check 2>&1)"
          grep -q 'local modifications' <<<"${out}" \
            || { echo "FAIL: local edits were not reported"; printf '%s\n' "${out}"; exit 1; }

          # A branch that exists only locally fails the SAME fetch a dead
          # network does, and used to get the same message: "Could not reach
          # the remote. Check connectivity, and whether the kill switch is on."
          # Both are wrong here — net_guard has already ruled the kill switch
          # out — and they send the reader to diagnose a network that is fine.
          # Real git against a real bare origin, which is what this fixture is
          # for; the unit suite covers the same three states through a stub.
          git -C /tmp/upd-work checkout -q -b only-on-this-machine
          out="$(cd /tmp/upd-work && ./update.sh --check 2>&1 || true)"
          printf '%s\n' "${out}"
          if ! grep -q 'does not exist on the remote' <<<"${out}"; then
            echo "FAIL: a branch missing from the remote was not diagnosed as one"; exit 1
          fi
          if grep -q 'kill switch' <<<"${out}"; then
            echo "FAIL: a local-only branch is still blamed on connectivity"; exit 1
          fi
          git -C /tmp/upd-work checkout -q "${BR}"
          echo "update.sh --check: detection, no-op guarantee, dirty-tree warning and fetch diagnosis all behave"

  system:
    name: System artifacts (nft ruleset + systemd units)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables
      - name: Netmode ruleset tests (content + kernel-side nft --check)
        run: sudo bash tests/test-netmode.sh
      - name: Inbound guard applies for real and never filters SSH
        run: |
          sudo ./netmode.sh harden
          sudo nft list table inet lca_inbound | tee /dev/stderr | grep -q 'hook input'
          # SSH (22) must not appear anywhere in the guard — proves no lockout.
          if sudo nft list table inet lca_inbound | grep -qw 22; then
            echo "inbound guard unexpectedly references port 22"; exit 1
          fi
          # Loopback stays reachable (guard only drops on non-lo/-tailscale).
          python3 -m http.server 3000 >/dev/null 2>&1 &
          sleep 1
          curl -fsS --max-time 5 http://127.0.0.1:3000/ >/dev/null && echo "loopback:3000 reachable through the guard (correct)"
          kill %1 2>/dev/null || true
      - name: The guard must actually DROP a non-loopback connection
        # Everything above proves the guard EXISTS and does not block loopback.
        # None of it proves it drops anything: a ruleset with the wrong hook,
        # the wrong priority, or an accept ahead of the drop would still pass.
        # Docker's bridge gives a genuine non-lo, non-tailscale0 path to the
        # host, so a container connecting to the host's bridge IP exercises the
        # same input hook a public client would.
        run: |
          set -euo pipefail
          GW="$(sudo docker network inspect bridge -f '{{range .IPAM.Config}}{{.Gateway}}{{end}}')"
          [ -n "${GW}" ] || { echo "could not determine the docker bridge gateway"; exit 1; }
          echo "host bridge IP: ${GW}"
          # 3000 is guarded; 3999 is not — the control proves we are testing the
          # guard rather than merely failing to reach the host at all.
          python3 -m http.server 3000 --bind 0.0.0.0 >/dev/null 2>&1 &
          python3 -m http.server 3999 --bind 0.0.0.0 >/dev/null 2>&1 &
          sleep 2
          if sudo docker run --rm --network bridge alpine:3.20 \
               wget -q -T 3 -O /dev/null "http://${GW}:3999/"; then
            echo "control: unguarded port 3999 IS reachable from the bridge (correct)"
          else
            echo "control failed: the host is unreachable from the bridge, so this test proves nothing"; exit 1
          fi
          if sudo docker run --rm --network bridge alpine:3.20 \
               wget -q -T 3 -O /dev/null "http://${GW}:3000/"; then
            echo "GUARD INEFFECTIVE: guarded port 3000 was reachable from a non-loopback path"; exit 1
          else
            echo "guarded port 3000 is DROPPED from the bridge (correct)"
          fi
          kill %1 %2 2>/dev/null || true
      - name: Install boot services and verify the units
        run: |
          sudo scripts/tune.sh --install-service
          sudo ./netmode.sh --install-service
          sudo ./backup.sh --install-timer
          systemd-analyze verify \
            /etc/systemd/system/local-code-agent-tune.service \
            /etc/systemd/system/local-code-agent-netmode.service \
            /etc/systemd/system/local-code-agent-backup.service \
            /etc/systemd/system/local-code-agent-backup.timer
          systemctl is-enabled local-code-agent-tune.service local-code-agent-netmode.service
          systemctl is-enabled local-code-agent-backup.timer
      - name: A boot unit pointing at a moved checkout must be reported
        # 'systemctl is-enabled' is an answer about a symlink. It keeps saying
        # "enabled" after the checkout the unit runs from is moved, renamed or
        # deleted, and the health check used to stop there — so a netmode unit
        # that could not start still printed a green "will be re-applied on
        # boot", and the WebUI/Ollama ports would go public at the next reboot.
        #
        # This is also the only place the ExecStart parse meets real systemd:
        # the unit tests can only feed it a recorded rendering, and the raw
        # line is echoed here so a future format change is visible in the log.
        shell: bash
        run: |
          set -euo pipefail
          UNIT=local-code-agent-netmode.service
          raw="$(systemctl show -p ExecStart --value "${UNIT}")"
          echo "systemd renders ExecStart as: ${raw}"
          parsed="$(bash -c 'source scripts/lib.sh; show_execstart_program' <<<"${raw}")"
          [[ "${parsed}" == "${PWD}/netmode.sh" ]] \
            || { echo "FAIL: parsed '${parsed}', expected ${PWD}/netmode.sh"; exit 1; }

          moved_reported() {
            grep -q 'can no longer execute' <<<"$(./check-system.sh --quick 2>&1 || true)"
          }

          # A healthy box must stay quiet — a false alarm here would be worse
          # than the blind spot it replaces.
          if moved_reported; then
            ./check-system.sh --quick 2>&1 | grep 'can no longer execute' || true
            echo "FAIL: a healthy boot unit was reported as broken"; exit 1
          fi

          # Now point the unit where the checkout is not.
          sudo sed -i 's|^ExecStart=.*|ExecStart="/gone/local-code-agent/netmode.sh" apply-saved|' \
            "/etc/systemd/system/${UNIT}"
          sudo systemctl daemon-reload
          moved_reported || {
            ./check-system.sh --quick 2>&1 | tail -30
            echo "FAIL: a boot unit whose program is missing was not reported"; exit 1; }

          # ...and the fix the warning names must actually repair it.
          sudo ./netmode.sh harden
          if moved_reported; then
            ./check-system.sh --quick 2>&1 | grep 'can no longer execute' || true
            echo "FAIL: 'netmode.sh harden' did not repair the boot unit"; exit 1
          fi
          echo "boot unit: staleness reported, and 'netmode.sh harden' repairs it"
      - name: A backup schedule changed in .env must be reported until applied
        # The timer keeps the schedule it was installed with. Editing
        # BACKUP_SCHEDULE and forgetting '--install-timer' leaves backups on
        # the old cadence while .env claims otherwise — same class as the WebUI
        # and ollama drift. The second half is the part that matters: systemd
        # normalises "daily" to "*-*-* 00:00:00", so a naive string compare
        # would warn forever on a healthy box, and an unfixable warning is
        # worse than none.
        shell: bash
        run: |
          set -euo pipefail
          sched() {
            systemctl show -p TimersCalendar --value local-code-agent-backup.timer \
              | sed -n 's/.*OnCalendar=\(.*\) ; next_elapse=.*/\1/p' | head -1
          }
          drift_reported() { grep -q 'backup schedule drift' <<<"$(./check-system.sh 2>&1 || true)"; }

          # Baseline: installed from this .env, so nothing to report.
          if drift_reported; then echo "FAIL: drift reported when none exists"; exit 1; fi

          # The mistake: edit .env, forget to re-install the timer.
          sed -i 's|^BACKUP_SCHEDULE=.*|BACKUP_SCHEDULE="Mon *-*-* 04:00:00"|' .env
          grep -q '^BACKUP_SCHEDULE=' .env || { echo "FAIL: could not edit .env"; exit 1; }
          before="$(sched)"; echo "timer still on: ${before}"
          drift_reported || { ./check-system.sh 2>&1 | tail -25; echo "FAIL: schedule drift was not reported"; exit 1; }

          # The documented fix must actually move the timer, and silence it.
          sudo ./backup.sh --install-timer
          after="$(sched)"; echo "timer now on: ${after}"
          [[ "${before}" != "${after}" ]] || { echo "FAIL: --install-timer did not change the timer"; exit 1; }
          if drift_reported; then echo "FAIL: drift still reported after applying"; exit 1; fi

          # And the false-positive guard: the same schedule written in systemd's
          # shorthand must NOT read as a difference.
          sudo ./backup.sh --install-timer >/dev/null
          sed -i 's|^BACKUP_SCHEDULE=.*|BACKUP_SCHEDULE=daily|' .env
          sudo ./backup.sh --install-timer >/dev/null
          sed -i 's|^BACKUP_SCHEDULE=.*|BACKUP_SCHEDULE="*-*-* 00:00:00"|' .env
          if drift_reported; then
            echo "timer: $(sched)  .env: $(grep '^BACKUP_SCHEDULE=' .env)"
            echo "FAIL: 'daily' and '*-*-* 00:00:00' were reported as drift"; exit 1
          fi
          echo "backup schedule: drift reported until applied, and shorthands do not false-positive"
      - name: Render the ollama drop-in and verify its contents
        run: |
          sudo bash -c 'source scripts/lib.sh && load_env && render_ollama_dropin'
          for key in OLLAMA_HOST OLLAMA_CONTEXT_LENGTH OLLAMA_KEEP_ALIVE OLLAMA_MAX_LOADED_MODELS; do
            grep "^Environment=${key}=" /etc/systemd/system/ollama.service.d/local-code-agent.conf
          done

  minimal-base:
    # Guards the dependency contract on a TRULY minimal image. The normal
    # runners (and cloud images) preinstall zstd, ca-certificates, iproute2,
    # etc. — which is exactly how missing-dependency bugs slipped through
    # before. Running install_dependencies.sh on bare ubuntu:24.04 and then
    # asserting the tools resolve catches any such regression automatically.
    name: Minimal-base install (catches missing deps)
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Bootstrap (bare image has no git/CA bundle for checkout)
        run: |
          apt-get update
          apt-get install -y git ca-certificates
      - uses: actions/checkout@v5
      - name: Run install_dependencies.sh on a minimal base
        run: bash scripts/install_dependencies.sh
      - name: Every tool the stack relies on must now resolve
        run: |
          export PATH="${PATH}:/usr/sbin:/sbin"
          missing=0
          for t in curl wget git python3 jq zstd nft ss; do
            if command -v "$t" >/dev/null; then echo "ok   $t"; else echo "MISSING $t"; missing=1; fi
          done
          test -s /etc/ssl/certs/ca-certificates.crt || { echo "MISSING CA bundle"; missing=1; }
          python3 -m venv /tmp/venvtest && echo "ok   python3 -m venv"
          exit "${missing}"
      - name: do-user-data.sh — the DigitalOcean first-boot script, both outcomes
        # This is the file a user literally pastes into the droplet creation
        # form, and until now nothing tested it at all. YOUR-TURN.md tells them
        # to watch the log for a verdict line, so the failure path matters as
        # much as the success path: if a bad repo URL just stops the log, that
        # is indistinguishable from "still working" and they wait 30 minutes
        # for nothing.
        shell: bash
        run: |
          set -euo pipefail
          # A PR build checks out a DETACHED merge commit, so the mirror needs a
          # real branch for its HEAD to resolve — otherwise the clone lands
          # empty and this would "pass" against nothing.
          git config --global --add safe.directory "$(pwd)"
          git branch -f ci-dud-test HEAD
          git clone --quiet --bare . /tmp/lca-mirror.git
          git -C /tmp/lca-mirror.git symbolic-ref HEAD refs/heads/ci-dud-test

          LCA_REPO_URL=/tmp/lca-mirror.git LCA_DIR=/tmp/lca-dud LCA_LOG=/tmp/dud.log \
            LCA_RUN_SETUP=false bash deploy/do-user-data.sh
          test -x /tmp/lca-dud/bin/lca || { echo "FAIL: clone lacks an executable bin/lca"; exit 1; }
          grep -q 'first-boot install finished' /tmp/dud.log \
            || { echo "FAIL: no completion line in the log"; cat /tmp/dud.log; exit 1; }

          # Re-running must be safe — the docs tell people to do exactly that.
          LCA_REPO_URL=/tmp/lca-mirror.git LCA_DIR=/tmp/lca-dud LCA_LOG=/tmp/dud.log \
            LCA_RUN_SETUP=false bash deploy/do-user-data.sh

          # A clone that cannot succeed must fail loudly AND say so in the log.
          set +e
          LCA_REPO_URL=/tmp/definitely-not-here.git LCA_DIR=/tmp/lca-dud-bad \
            LCA_LOG=/tmp/dud-bad.log LCA_RUN_SETUP=false bash deploy/do-user-data.sh >/dev/null 2>&1
          rc=$?
          set -e
          test "${rc}" -ne 0 \
            || { echo "FAIL: a failed clone reported success (exit 0)"; exit 1; }
          grep -q 'FIRST-BOOT INSTALL FAILED' /tmp/dud-bad.log \
            || { echo "FAIL: the log gives no verdict after a failed clone"; cat /tmp/dud-bad.log; exit 1; }

          # A clone that SUCCEEDS and brings back the wrong tree is a third
          # outcome, and it used to produce none of the three verdict lines:
          # setup.sh simply was not there, so the log ended with "setup
          # reported problems — its verdict line is above" pointing at a line
          # that did not exist. install.sh has checked for this since it was
          # caught cloning a stale 'main' holding only a README; the file whose
          # header says "EDIT ME if you forked the repository" did not.
          rm -rf /tmp/lca-notours /tmp/lca-notours.git /tmp/lca-dud-notours
          mkdir -p /tmp/lca-notours
          git -C /tmp/lca-notours init -q .
          echo '# some other project' > /tmp/lca-notours/README.md
          git -C /tmp/lca-notours -c user.email=ci@example.invalid -c user.name=CI \
            add -A
          git -C /tmp/lca-notours -c user.email=ci@example.invalid -c user.name=CI \
            commit --quiet -m 'not local-code-agent'
          git -C /tmp/lca-notours branch -f ci-notours HEAD
          git clone --quiet --bare /tmp/lca-notours /tmp/lca-notours.git
          git -C /tmp/lca-notours.git symbolic-ref HEAD refs/heads/ci-notours
          set +e
          LCA_REPO_URL=/tmp/lca-notours.git LCA_DIR=/tmp/lca-dud-notours \
            LCA_LOG=/tmp/dud-notours.log LCA_RUN_SETUP=false \
            bash deploy/do-user-data.sh >/dev/null 2>&1
          rc=$?
          set -e
          test "${rc}" -ne 0 \
            || { echo "FAIL: a clone with no setup.sh reported success"; cat /tmp/dud-notours.log; exit 1; }
          grep -q 'FIRST-BOOT INSTALL FAILED' /tmp/dud-notours.log \
            || { echo "FAIL: no verdict for a clone that is not this project"; cat /tmp/dud-notours.log; exit 1; }
          # ...and it must have stopped before installing a login banner out of
          # a tree that is not this project. Asserted on the LOG, not on
          # /etc/update-motd.d: the successful runs earlier in this same step
          # install a banner of their own, so the file's existence proves
          # nothing about this run.
          if grep -q 'Installing the login banner' /tmp/dud-notours.log; then
            echo "FAIL: a banner was installed from a foreign checkout"
            cat /tmp/dud-notours.log
            exit 1
          fi
          echo "do-user-data.sh: success, re-run, failed clone, wrong tree and failing setup all behave"

          # And the path that was dead code until now: setup itself failing.
          # Every run above uses LCA_RUN_SETUP=false, which is exactly why
          # nobody noticed that setup.sh printed "SETUP FINISHED WITH ERRORS"
          # and then exited 0 — so this branch could never be taken and a
          # droplet with a broken install reported a successful first boot.
          # Stubbed rather than installing the world: this asserts the wiring,
          # while the unit tests assert that the real setup.sh returns the
          # status its verdict claims.
          rm -rf /tmp/lca-failsrc
          git clone --quiet . /tmp/lca-failsrc
          git config --global --add safe.directory /tmp/lca-failsrc
          printf '#!/usr/bin/env bash\necho "SETUP FINISHED WITH ERRORS — simulated"\nexit 1\n' \
            > /tmp/lca-failsrc/setup.sh
          chmod +x /tmp/lca-failsrc/setup.sh
          git -C /tmp/lca-failsrc -c user.email=ci@example.invalid -c user.name=CI \
            commit --quiet -am 'CI: setup.sh that fails'
          git -C /tmp/lca-failsrc branch -f ci-fail-test HEAD
          git clone --quiet --bare /tmp/lca-failsrc /tmp/lca-fail-mirror.git
          git -C /tmp/lca-fail-mirror.git symbolic-ref HEAD refs/heads/ci-fail-test

          set +e
          LCA_REPO_URL=/tmp/lca-fail-mirror.git LCA_DIR=/tmp/lca-dud-fail \
            LCA_LOG=/tmp/dud-fail.log LCA_RUN_SETUP=true bash deploy/do-user-data.sh >/dev/null 2>&1
          rc=$?
          set -e
          test "${rc}" -ne 0 \
            || { echo "FAIL: a failed setup reported a successful first boot"; cat /tmp/dud-fail.log; exit 1; }
          grep -q 'setup reported problems' /tmp/dud-fail.log \
            || { echo "FAIL: the log does not say setup reported problems"; cat /tmp/dud-fail.log; exit 1; }
          echo "do-user-data.sh: success, re-run, failed clone and failed setup all behave"
      - name: install.sh bootstraps on a bare image (clone only, no setup)
        # The one-command installer's whole job is to work on a machine with
        # nothing on it. Proving it here means it cannot rot into "works only
        # where git already happens to be installed".
        #
        # shell: bash is REQUIRED. This job runs in container: ubuntu:24.04,
        # where the runner falls back to 'sh -e' (dash) — which has no
        # 'pipefail', so 'set -euo pipefail' below dies with
        # "Illegal option -o pipefail". The other steps in this job only survive
        # the default because they happen to be sh-compatible.
        shell: bash
        run: |
          set -euo pipefail
          # ORDER MATTERS. Everything needing git must happen BEFORE git is
          # removed: a PR build checks out a DETACHED merge commit, so the head
          # branch name does not exist locally and '--branch <name>' would not
          # resolve — we make a local branch at HEAD to clone from.
          git config --global --add safe.directory "$(pwd)"
          git branch -f ci-bootstrap-test HEAD
          SRC="$(pwd)"
          # NOW remove git, so install.sh has to install it itself. That is the
          # whole point of this step: the installer must work on a machine that
          # has nothing, not merely where git happens to be present already.
          apt-get purge -y git >/dev/null 2>&1 || true
          command -v git >/dev/null 2>&1 \
            && echo "note: git survived the purge; install.sh's apt path is not exercised this run" \
            || echo "git removed — install.sh must reinstall it"
          LCA_REPO_URL="${SRC}" LCA_DIR=/tmp/lca-bootstrap \
            LCA_BRANCH=ci-bootstrap-test \
            LCA_RUN_SETUP=false bash install.sh
          test -x /tmp/lca-bootstrap/setup.sh
          test -x /tmp/lca-bootstrap/scripts/selftest.sh
          # bin/ too. install.sh was the only one of the four re-chmod sites
          # that left it out, and LCA_RUN_SETUP=false — this very path — is
          # where nothing else re-applies the bit before the user runs setup by
          # hand. 'lca' not being executable is the whole command gone.
          test -x /tmp/lca-bootstrap/bin/lca
          echo "install.sh bootstrapped a working checkout on a bare image"

  e2e:
    name: E2E — real Ollama install + real generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Pin the smallest model this project actually ships (3b)
        # This pinned 0.5b, "because runners are small". It kept the job fast
        # and it proved nothing about the one thing the product does: 0.5b
        # answers with a bare fenced code block carrying no filename, so aider
        # has nothing to apply and no file is ever written. The acceptance test
        # only asked for a reply, so this stayed green anyway.
        #
        # Measured on a 4-vCPU 15 GiB box — the same class as this runner —
        # asking for one file: 0.5b wrote it 0 times out of 10, 3b wrote it 10
        # times out of 10 in about 25 seconds each. 3b is also the smallest
        # rung scripts/tune.sh will ever auto-select, so this job now runs on
        # the floor of what real deployments get, not below it.
        run: |
          cp .env.example .env
          sed -i 's/^AUTO_TUNE=.*/AUTO_TUNE=false/' .env
          sed -i 's/^MODEL_NAME=.*/MODEL_NAME=qwen2.5-coder:3b/' .env
          sed -i 's/^ENABLE_WEBUI=.*/ENABLE_WEBUI=false/' .env
      - name: install_ollama.sh for real (installer, drop-in, service, API)
        run: sudo scripts/install_ollama.sh
      - name: Drop-in is live in the running service
        run: |
          systemctl show ollama -p Environment | tee /dev/stderr | grep -q 'OLLAMA_MAX_LOADED_MODELS=1'
      - name: A pinned install must still apply .env to the running service
        # AUTO_TUNE=false meant "do not re-pick the model from RAM". It also,
        # accidentally, meant "ignore .env": tune.sh returned before its drift
        # check, so editing OLLAMA_KEEP_ALIVE did nothing on every boot,
        # forever, with nothing said — and 'lca model' sets AUTO_TUNE=false for
        # you, so that was the state of anyone who had pinned a model.
        # .env.example openly invites editing exactly this key.
        shell: bash
        run: |
          set -euo pipefail
          cp .env /tmp/env.before
          # Already false for this job — stated explicitly so the step does not
          # depend on an earlier one, and because "CI was in the affected state
          # all along" is precisely why nothing here ever caught this.
          sed -i 's/^AUTO_TUNE=.*/AUTO_TUNE=false/' .env
          sed -i 's/^OLLAMA_KEEP_ALIVE=.*/OLLAMA_KEEP_ALIVE=17m/' .env
          grep -q '^OLLAMA_KEEP_ALIVE=17m' .env || { echo "FAIL: could not edit .env"; exit 1; }

          # Precondition: the applied state has NOT caught up on its own.
          if systemctl show ollama -p Environment | grep -q 'OLLAMA_KEEP_ALIVE=17m'; then
            echo "FAIL: precondition wrong — the service already has the new value"; exit 1
          fi
          # ...and the health check must say so, for the user who has not
          # rebooted yet.
          drift="$(./check-system.sh 2>&1 || true)"
          grep -q 'config drift' <<<"${drift}" \
            || { printf '%s\n' "${drift}" | tail -30; echo "FAIL: check-system did not report the drift"; exit 1; }

          # The boot service is what applies it. This is the step that used to
          # do nothing at all.
          sudo -E scripts/tune.sh
          grep -q 'OLLAMA_KEEP_ALIVE=17m' /etc/systemd/system/ollama.service.d/local-code-agent.conf \
            || { echo "FAIL: tune.sh did not re-render the drop-in"; exit 1; }
          systemctl show ollama -p Environment | tee /dev/stderr | grep -q 'OLLAMA_KEEP_ALIVE=17m' \
            || { echo "FAIL: the running service never picked up the pinned setting"; exit 1; }
          if grep -q 'config drift' <<<"$(./check-system.sh 2>&1 || true)"; then
            echo "FAIL: drift still reported after it was applied"; exit 1
          fi

          # Leave the job as it was found, applied state included.
          cp /tmp/env.before .env
          sudo -E scripts/tune.sh
          echo "pinned settings reach the running service, and drift is reported until they do"
      - name: Pull the model and require a real generation
        run: |
          source scripts/lib.sh
          load_env
          pull_model "${MODEL_NAME}"
          model_responds "${MODEL_NAME}" 300
          echo "real generation OK from ${MODEL_NAME}"
      - name: update-model.sh end-to-end (pull -> validate -> pin, and back)
        # Switching DOWN to the tiny model is the cheap way to exercise a real
        # pull-validate-pin. Switching back is not tidying-up: update-model.sh
        # rewrites .env, so every step after this one — aider, the acceptance
        # test — runs on whatever this leaves behind, and on 0.5b the
        # acceptance test cannot pass. The second switch costs nothing; 3b is
        # already pulled.
        run: |
          ./update-model.sh qwen2.5-coder:0.5b
          grep -q '^MODEL_NAME=qwen2.5-coder:0.5b' .env
          grep -q '^AUTO_TUNE=false' .env
          ./update-model.sh qwen2.5-coder:3b
          grep -q '^MODEL_NAME=qwen2.5-coder:3b' .env
      - name: Idempotency — re-running the installer must be safe
        run: |
          sudo scripts/install_ollama.sh
          source scripts/lib.sh && load_env && wait_for_ollama 60
      - name: Install aider (scripts/install_python.sh for real)
        run: scripts/install_python.sh
      - name: Full stack — run-agent.sh -> aider -> litellm -> Ollama
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          mkdir -p /tmp/e2e-project
          cd /tmp/e2e-project
          git init -q
          # run-agent.sh never cd's — running it from a scratch project also
          # proves aider starts in the caller's directory.
          "${GITHUB_WORKSPACE}/run-agent.sh" --message "Reply with the single word: ready" --yes-always --no-stream | tee /tmp/aider-out.txt
          test -s /tmp/aider-out.txt
      - name: The acceptance test itself must pass (scripts/selftest.sh)
        # selftest.sh is what users run to prove the stack works on their own
        # box. Running it here means it can never bit-rot unnoticed: it does a
        # live Ollama -> generation -> aider round-trip. WebUI is disabled in
        # this job, so its step 4 skips rather than fails.
        run: ./scripts/selftest.sh
      - name: lca speed measures a real generation and reaches a verdict
        # speed.sh is new and does real arithmetic on Ollama's timing counters.
        # A small num_predict keeps it quick while still exercising the warm-up
        # path, the tokens/second maths and the verdict branches.
        run: |
          set -euo pipefail
          # Every assertion greps a HERESTRING, never a pipe. 'grep -q' exits the
          # instant it matches, which closes the pipe and SIGPIPEs the writer;
          # under 'set -o pipefail' that makes the pipeline report 141 and the
          # check fail precisely BECAUSE the pattern was found. Capturing first
          # also means a failure prints what the command actually said.
          out="$(./bin/lca speed --tokens 16 2>&1)"
          printf '%s\n' "${out}"
          # A rate must actually have been computed — 'inf', '0.0' or an empty
          # field would all mean the counters were misread.
          grep -qE 'generation +[0-9]+\.[0-9]+ tokens/second' <<<"${out}" \
            || { echo "FAIL: no tokens/second figure"; exit 1; }
          grep -q 'What this means' <<<"${out}" \
            || { echo "FAIL: no verdict was reached"; exit 1; }
          # Running twice must produce the comparison against the stored baseline.
          out2="$(./bin/lca speed --tokens 16 2>&1)"
          printf '%s\n' "${out2}"
          grep -q 'vs last run' <<<"${out2}" \
            || { echo "FAIL: the second run did not compare against the first"; exit 1; }
      - name: lca logs works, and reads the journal for a real ollama service
        run: |
          set -euo pipefail
          out="$(./bin/lca logs -n 5 2>&1)"
          printf '%s\n' "${out}"
          grep -q 'ollama (the model server)' <<<"${out}" \
            || { echo "FAIL: no ollama section"; exit 1; }
          # This runner HAS systemd and a real ollama unit, so the journal must
          # actually be readable here — the graceful "no systemd" path must not
          # be what is exercised. if/fi, not 'grep && exit 1': under set -e a
          # non-matching grep is the PASSING case and would abort the step.
          if grep -q 'No systemd on this machine' <<<"${out}"; then
            echo "FAIL: fell back to the no-systemd path on a systemd runner"; exit 1
          fi
          ./bin/lca logs -n 5 ollama >/dev/null
          # -f with no source must be refused rather than interleaving streams.
          if ./bin/lca logs -f >/dev/null 2>&1; then
            echo "FAIL: 'lca logs -f' with no source should be refused"; exit 1
          fi
      - name: setup.sh itself runs, and is safe to re-run
        # Until now NOTHING executed setup.sh — the only reference anywhere was
        # 'test -x'. Every installer it calls was covered individually, but the
        # orchestrator every user actually runs was not, so an ordering bug
        # between them would have shipped green.
        #
        # Runnable here only because SKIP_TAILSCALE exists: without it setup
        # would pull in an external VPN installer. Docker and the WebUI are
        # already off in this job. Everything else is installed by the steps
        # above, so this exercises ordering, the verdict logic and
        # sync_env_keys rather than re-downloading the world.
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^SKIP_TAILSCALE=.*/SKIP_TAILSCALE=true/' .env || echo 'SKIP_TAILSCALE=true' >> .env
          grep -q '^SKIP_TAILSCALE=true' .env || { echo "FAIL: could not set SKIP_TAILSCALE"; exit 1; }

          out="$(sudo -E ./setup.sh </dev/null 2>&1)" || {
            printf '%s\n' "${out}" | tail -40; echo "FAIL: setup.sh exited non-zero"; exit 1; }
          printf '%s\n' "${out}" | tail -25

          # The zero-terminal user watches the log for exactly this line.
          grep -qF 'SETUP COMPLETE — local-code-agent is ready.' <<<"${out}" \
            || { echo "FAIL: setup.sh did not print its success verdict"; exit 1; }
          # And it must NOT have installed the thing we told it to skip.
          if grep -q 'Running the official Tailscale installer' <<<"${out}"; then
            echo "FAIL: SKIP_TAILSCALE was ignored"; exit 1
          fi

          # "Safe to re-run at any time" is a documented promise that nothing
          # verified. Second run must also succeed and reach the same verdict.
          out2="$(sudo -E ./setup.sh </dev/null 2>&1)" || {
            printf '%s\n' "${out2}" | tail -40; echo "FAIL: setup.sh is not idempotent"; exit 1; }
          grep -qF 'SETUP COMPLETE — local-code-agent is ready.' <<<"${out2}" \
            || { echo "FAIL: re-run did not reach the success verdict"; exit 1; }
          echo "setup.sh: runs, honours SKIP_TAILSCALE, and is safe to re-run"
      - name: The login banner must survive the way pam_motd actually runs it
        # The banner is the first thing anyone sees on the box, and its one
        # real hazard is invisible to every other kind of test: run-parts
        # executes the SYMLINK in /etc/update-motd.d, so an unresolved
        # SCRIPT_DIR looks for lib.sh there and every login prints
        # "lib.sh: No such file or directory" instead of the status. That bug
        # was real and was caught only by running it exactly like this.
        shell: bash
        run: |
          set -euo pipefail
          # Make the gate meaningful on any runner image: setup.sh correctly
          # skips the install when the directory is absent, which would leave
          # nothing to assert.
          sudo mkdir -p /etc/update-motd.d
          sudo ./scripts/motd.sh --install
          test -L /etc/update-motd.d/99-local-code-agent \
            || { echo "FAIL: banner was not installed"; exit 1; }

          # run-parts --lsbsysinit is how pam_motd invokes these, and it SKIPS
          # any filename containing a dot — so being listed is the assertion.
          listed="$(run-parts --lsbsysinit --list /etc/update-motd.d)"
          grep -q '99-local-code-agent' <<<"${listed}" \
            || { printf '%s\n' "${listed}"; echo "FAIL: run-parts skips our banner"; exit 1; }

          # Executed through the symlink, and it must exit 0.
          banner="$(/etc/update-motd.d/99-local-code-agent)" \
            || { printf '%s\n' "${banner}"; echo "FAIL: banner exited non-zero"; exit 1; }
          printf '%s\n' "${banner}"
          # if/fi, never 'grep -q PAT && { exit 1; }': the non-matching grep IS
          # the passing case here, and as an and-list it makes the script's
          # exit status 1 — the step then fails precisely when it should pass.
          if grep -q 'lib.sh' <<<"${banner}"; then
            echo "FAIL: banner could not find lib.sh through the symlink"; exit 1
          fi

          # Ollama is installed and running by this point, so the honest
          # verdict here is 'ready' — with the configured model named.
          grep -q 'ready' <<<"${banner}" \
            || { echo "FAIL: banner does not report a ready stack"; exit 1; }
          model="$(grep -E '^MODEL_NAME=' .env | cut -d= -f2)"
          grep -qF "${model}" <<<"${banner}" \
            || { echo "FAIL: banner does not name the configured model ${model}"; exit 1; }

          # The state it exists for, and the only one a user meets on a fresh
          # droplet: an install still in flight. Unobservable without a log.
          fake=/tmp/lca-inflight.log
          printf '=== local-code-agent first-boot install started: now ===\n==> Downloading the model\n' > "${fake}"
          inflight="$(LCA_LOG="${fake}" /etc/update-motd.d/99-local-code-agent)"
          printf '%s\n' "${inflight}"
          grep -q 'still installing' <<<"${inflight}" \
            || { echo "FAIL: banner does not report an install in progress"; exit 1; }
          grep -q 'Downloading the model' <<<"${inflight}" \
            || { echo "FAIL: banner does not report how far the install got"; exit 1; }
          echo "login banner: installed, listed by run-parts, and truthful in both states"
      - name: The installed 'lca' must read as this checkout
        # That check compares the installed symlink against check-system.sh's
        # own path, and the two are spelled differently the moment anything
        # above the checkout is itself a symlink — 'cd && pwd' keeps the
        # symlinked spelling, readlink -f does not. Getting it wrong fails
        # nothing: it prints a confident warning about a healthy machine, and
        # nobody reads a health check that does that twice. So assert it here,
        # in the job where setup.sh has actually created the symlink.
        shell: bash
        run: |
          set -euo pipefail
          out="$(./check-system.sh --quick 2>&1 || true)"
          if ! grep -q "'lca' on PATH runs this checkout" <<<"${out}"; then
            grep -i "lca' on PATH" <<<"${out}" || echo "(no lca line at all)"
            echo "FAIL: the installed lca symlink was not recognised as this checkout"; exit 1
          fi
          if grep -q 'DIFFERENT checkout' <<<"${out}"; then
            echo "FAIL: a healthy install was reported as a foreign checkout"; exit 1
          fi
          echo "lca symlink: recognised as this checkout"
      - name: lca apply agrees with a freshly-installed stack
        # setup.sh has just run, so by definition nothing has drifted. If apply
        # reports work here it disagrees with the installer about what .env
        # means, which is worse than either being wrong alone.
        shell: bash
        run: |
          set -euo pipefail
          out="$(sudo -E ./bin/lca apply 2>&1)"
          printf '%s\n' "${out}"
          grep -q 'nothing to do' <<<"${out}" \
            || { echo "FAIL: apply wants to change a stack setup.sh just built"; exit 1; }
      - name: backup.sh / restore.sh round-trip
        run: |
          ./backup.sh
          tar tzf backups/local-code-agent-backup-*.tar.gz
          tar tzf backups/local-code-agent-backup-*.tar.gz | grep -q 'env'
          tar tzf backups/local-code-agent-backup-*.tar.gz | grep -q 'models.txt'
          ./restore.sh
      - name: check-system.sh must exit 0 on this real install (webui disabled)
        run: |
          sudo apt-get install -y nftables
          ./check-system.sh
      - name: uninstall.sh removes the stack (and refuses without --yes)
        run: |
          if ./uninstall.sh </dev/null; then
            echo "uninstall must refuse non-interactive runs without --yes"; exit 1
          fi
          command -v ollama
          sudo ./uninstall.sh --yes
          if command -v ollama; then echo "ollama binary still present"; exit 1; fi
          test ! -e /etc/systemd/system/ollama.service.d
          test ! -e /etc/systemd/system/local-code-agent-tune.service
          test ! -e /etc/local-code-agent
          # A banner left behind would greet every login on behalf of a stack
          # that no longer exists.
          test ! -e /etc/update-motd.d/99-local-code-agent
          test ! -d .venv
          # Generated state outside the repo must go too (run-agent.sh writes an
          # aider model-metadata file under ~/.cache/local-code-agent).
          test ! -d "${HOME}/.cache/local-code-agent"
          echo "uninstall verified"

  webui:
    name: E2E — Open WebUI container + volume backup/restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare .env
        run: cp .env.example .env
      - name: install_webui.sh for real (docker preinstalled on runners)
        run: scripts/install_webui.sh
      - name: webui.sh status must pass
        run: ./webui.sh status
      - name: The chat really receives our system prompt and starter questions
        # Reading Open WebUI's source says DEFAULT_MODEL_PARAMS and
        # DEFAULT_PROMPT_SUGGESTIONS are seeded into its config table; this is
        # what proves they actually are. It also fails loudly if a future image
        # stops honouring them, which would otherwise be invisible — the chat
        # would just quietly go back to answering like a stock model.
        run: |
          set -euo pipefail
          command -v sqlite3 >/dev/null || sudo apt-get install -y -qq sqlite3

          # 1. OUR side of the contract: the container must actually carry the
          #    values. This is what regresses if someone edits install_webui.sh,
          #    and it is true regardless of how Open WebUI stores config.
          env_json="$(sudo docker inspect -f '{{json .Config.Env}}' open-webui)"
          printf '%s' "${env_json}" | jq -e 'map(select(startswith("DEFAULT_MODEL_PARAMS="))) | length == 1' >/dev/null \
            || { echo "FAIL: DEFAULT_MODEL_PARAMS was never passed to the container"; printf '%s' "${env_json}" | jq -r '.[]' | cut -c1-80; exit 1; }
          # Compared to THIS repo's prompt, byte for byte — not to a substring
          # of it. The old assertion was `.system | test("local-code-agent")`,
          # which every version of the prompt has ever satisfied, including the
          # one that made a real user's chat invent a tool call. It proved the
          # container had *a* prompt, never that it had the current one, which
          # is the only failure that has actually happened here.
          live_prompt="$(printf '%s' "${env_json}" \
            | jq -r '.[] | select(startswith("DEFAULT_MODEL_PARAMS="))' \
            | sed 's/^DEFAULT_MODEL_PARAMS=//' | jq -r '.system')"
          want_prompt="$(bash -c 'source scripts/lib.sh >/dev/null 2>&1; lca_system_prompt')"
          if [[ "${live_prompt}" != "${want_prompt}" ]]; then
            echo "FAIL: the container's system prompt is not this repo's"
            diff <(printf '%s\n' "${want_prompt}") <(printf '%s\n' "${live_prompt}") || true
            exit 1
          fi
          printf '%s' "${env_json}" | jq -r '.[] | select(startswith("DEFAULT_PROMPT_SUGGESTIONS="))' \
            | sed 's/^DEFAULT_PROMPT_SUGGESTIONS=//' | jq -e 'length > 0' >/dev/null \
            || { echo "FAIL: DEFAULT_PROMPT_SUGGESTIONS is missing or empty"; exit 1; }
          echo "OK: the container carries our system prompt and starter questions"

          # 2. Open WebUI must have PARSED them. It logs and swallows bad JSON,
          #    which would otherwise leave the stock suggestions in place with
          #    nothing failing anywhere.
          # Captured, not piped: 'docker logs' produces a lot of output, and a
          # matching 'grep -q' would exit early and SIGPIPE it — under pipefail
          # the pipeline then reports 141, the 'if' reads FALSE, and a real
          # parse error would be found and silently not reported.
          webui_logs="$(sudo docker logs open-webui 2>&1 || true)"
          if grep -q 'Error loading DEFAULT_PROMPT_SUGGESTIONS' <<<"${webui_logs}"; then
            echo "FAIL: Open WebUI could not parse our starter questions"; exit 1
          fi

          # 3. And Open WebUI must actually SERVE them. This asks the running
          #    server what a signed-in user would receive, which is the only
          #    thing that matters — and is stable regardless of whether upstream
          #    persists the value or serves it from its in-memory defaults.
          tests/webui-config-gate.sh "http://127.0.0.1:${WEBUI_PORT:-3000}"
      - name: lca logs reads the real container's output
        run: |
          set -euo pipefail
          out="$(./bin/lca logs -n 20 webui 2>&1)"
          printf '%s\n' "${out}"
          # A running container must produce actual log lines, not the
          # "could not read logs" fallback.
          if grep -q 'Could not read logs' <<<"${out}"; then
            echo "FAIL: could not read logs from a container that is running"; exit 1
          fi
      - name: Recreation from edited .env (port change) must take effect
        run: |
          sed -i 's/^WEBUI_PORT=.*/WEBUI_PORT=3210/' .env
          scripts/install_webui.sh
          curl -fsS --max-time 5 http://127.0.0.1:3210 >/dev/null
      - name: Closing signups in .env alone must be reported, not silently ignored
        # docs/YOUR-TURN.md step 4.3 tells the user to lock signups by editing
        # .env and re-running install_webui.sh. Editing .env does NOT change a
        # running container, so someone who does the first half and forgets the
        # second is left believing signups are closed while anyone who can
        # reach the app can still register. That is the one drift that matters
        # for a project whose whole premise is privacy, and nothing reported it.
        shell: bash
        run: |
          set -euo pipefail
          # Baseline: .env and the container agree, so there must be no warning.
          before="$(./webui.sh status 2>&1)"
          printf '%s\n' "${before}"
          if grep -qi 'signup drift' <<<"${before}"; then
            echo "FAIL: signup drift reported when .env and the container agree"; exit 1
          fi

          # The mistake itself: edit .env, forget the re-run.
          sed -i 's/^WEBUI_ENABLE_SIGNUP=.*/WEBUI_ENABLE_SIGNUP=false/' .env
          grep -q '^WEBUI_ENABLE_SIGNUP=false' .env \
            || { echo "FAIL: could not edit .env"; exit 1; }
          drifted="$(./webui.sh status 2>&1)"
          printf '%s\n' "${drifted}"
          grep -qi 'signup drift' <<<"${drifted}" \
            || { echo "FAIL: closing signups in .env alone was reported as nothing at all"; exit 1; }
          # The container really is still accepting signups at this point.
          sudo docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' open-webui \
            | grep -qx 'ENABLE_SIGNUP=true' \
            || { echo "FAIL: precondition wrong — container was not left with signups open"; exit 1; }

          # And the documented fix must actually close them.
          scripts/install_webui.sh
          sudo docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' open-webui \
            | grep -qx 'ENABLE_SIGNUP=false' \
            || { echo "FAIL: re-running install_webui.sh did not close signups"; exit 1; }
          after="$(./webui.sh status 2>&1)"
          printf '%s\n' "${after}"
          if grep -qi 'signup drift' <<<"${after}"; then
            echo "FAIL: drift still reported after applying the change"; exit 1
          fi
          echo "signup drift: reported when it exists, silent when it does not"
      - name: lca apply re-applies what drifted, and leaves everything else alone
        # The previous step leaves .env and the container agreeing, with
        # signups closed. 'lca apply' exists because three separate settings
        # silently failed to take effect and 'lca check' names a different fix
        # command for each; this proves the one command does the job, is safe
        # to re-run, and cannot change anything in a dry run.
        shell: bash
        run: |
          set -euo pipefail
          signups() {
            sudo docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' open-webui \
              | sed -n 's/^ENABLE_SIGNUP=//p' | head -1
          }
          # Nothing has drifted, so nothing may be touched.
          quiet="$(./bin/lca apply 2>&1)"
          printf '%s\n' "${quiet}"
          grep -q 'nothing to do' <<<"${quiet}" \
            || { echo "FAIL: apply claimed work when .env and the system agree"; exit 1; }

          # Drift the one setting whose silence is a security problem.
          before="$(signups)"
          sed -i 's/^WEBUI_ENABLE_SIGNUP=.*/WEBUI_ENABLE_SIGNUP=true/' .env
          [[ "${before}" == "false" ]] \
            || { echo "FAIL: precondition wrong — container signups were '${before}'"; exit 1; }

          # A dry run must report it and change absolutely nothing.
          dry="$(./bin/lca apply --dry-run 2>&1)"
          printf '%s\n' "${dry}"
          # -F: '[would]' is a character class to grep, not a literal.
          grep -qF '[would]' <<<"${dry}" || { echo "FAIL: dry run reported no change"; exit 1; }
          [[ "$(signups)" == "false" ]] \
            || { echo "FAIL: --dry-run changed the running container"; exit 1; }

          # The real thing.
          ./bin/lca apply
          [[ "$(signups)" == "true" ]] \
            || { echo "FAIL: apply did not reach the running container"; exit 1; }

          # And it must be safe to run again.
          again="$(./bin/lca apply 2>&1)"
          printf '%s\n' "${again}"
          grep -q 'nothing to do' <<<"${again}" \
            || { echo "FAIL: apply is not idempotent"; exit 1; }
          echo "lca apply: applies drift, honours --dry-run, and is safe to re-run"
      - name: Volume-inclusive backup, destroy, restore — data must survive
        run: |
          sudo docker run --rm --entrypoint sh -v open-webui:/d \
            ghcr.io/open-webui/open-webui:main -c 'echo hello-backup > /d/ci-marker.txt'
          ./backup.sh
          tar tzf backups/local-code-agent-backup-*.tar.gz | grep -q 'open-webui-volume.tar.gz'
          sudo docker rm -f open-webui
          sudo docker volume rm open-webui
          ./restore.sh
          marker="$(sudo docker run --rm --entrypoint cat -v open-webui:/d \
            ghcr.io/open-webui/open-webui:main /d/ci-marker.txt)"
          test "${marker}" = "hello-backup"
          ./webui.sh status
      - name: webui.sh stop/start cycle
        run: |
          ./webui.sh stop
          ./webui.sh start
          ./webui.sh status
