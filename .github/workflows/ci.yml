name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: ShellCheck + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: bash -n (syntax) on every script
        run: |
          for f in *.sh scripts/*.sh deploy/*.sh tests/*.sh; do
            bash -n "$f"
          done
      - name: shellcheck (zero findings required)
        run: shellcheck -x -P SCRIPTDIR *.sh scripts/*.sh deploy/*.sh tests/*.sh

  test:
    name: Unit tests + tune dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Library + tune-ladder unit tests
        run: bash tests/test-lib.sh
      - name: tune.sh --dry-run exits 0 and changes nothing
        run: |
          bash scripts/tune.sh --dry-run
          test -f .env && diff .env .env.example

  system:
    name: System artifacts (nft ruleset + systemd units)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables
      - name: Netmode ruleset tests (content + kernel-side nft --check)
        run: sudo bash tests/test-netmode.sh
      - name: Install boot services and verify the units
        run: |
          sudo scripts/tune.sh --install-service
          sudo ./netmode.sh --install-service
          systemd-analyze verify \
            /etc/systemd/system/local-code-agent-tune.service \
            /etc/systemd/system/local-code-agent-netmode.service
          systemctl is-enabled local-code-agent-tune.service local-code-agent-netmode.service
      - name: Render the ollama drop-in and verify its contents
        run: |
          sudo bash -c 'source scripts/lib.sh && load_env && render_ollama_dropin'
          for key in OLLAMA_HOST OLLAMA_CONTEXT_LENGTH OLLAMA_KEEP_ALIVE OLLAMA_MAX_LOADED_MODELS; do
            grep "^Environment=${key}=" /etc/systemd/system/ollama.service.d/local-code-agent.conf
          done

  e2e:
    name: E2E — real Ollama install + real generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Pin a CI-sized model (runners are small; 0.5b keeps this fast)
        run: |
          cp .env.example .env
          sed -i 's/^AUTO_TUNE=.*/AUTO_TUNE=false/' .env
          sed -i 's/^MODEL_NAME=.*/MODEL_NAME=qwen2.5-coder:0.5b/' .env
          sed -i 's/^ENABLE_WEBUI=.*/ENABLE_WEBUI=false/' .env
      - name: install_ollama.sh for real (installer, drop-in, service, API)
        run: sudo scripts/install_ollama.sh
      - name: Drop-in is live in the running service
        run: |
          systemctl show ollama -p Environment | tee /dev/stderr | grep -q 'OLLAMA_MAX_LOADED_MODELS=1'
      - name: Pull the model and require a real generation
        run: |
          source scripts/lib.sh
          load_env
          pull_model "${MODEL_NAME}"
          model_responds "${MODEL_NAME}" 300
          echo "real generation OK from ${MODEL_NAME}"
      - name: update-model.sh end-to-end (pull -> validate -> pin)
        run: |
          ./update-model.sh qwen2.5-coder:0.5b
          grep -q '^MODEL_NAME=qwen2.5-coder:0.5b' .env
          grep -q '^AUTO_TUNE=false' .env
      - name: Idempotency — re-running the installer must be safe
        run: |
          sudo scripts/install_ollama.sh
          source scripts/lib.sh && load_env && wait_for_ollama 60
      - name: Install aider (scripts/install_python.sh for real)
        run: scripts/install_python.sh
      - name: Full stack — run-agent.sh -> aider -> litellm -> Ollama
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          mkdir -p /tmp/e2e-project
          cd /tmp/e2e-project
          git init -q
          # run-agent.sh never cd's — running it from a scratch project also
          # proves aider starts in the caller's directory.
          "${GITHUB_WORKSPACE}/run-agent.sh" --message "Reply with the single word: ready" --yes-always --no-stream | tee /tmp/aider-out.txt
          test -s /tmp/aider-out.txt
      - name: backup.sh / restore.sh round-trip
        run: |
          ./backup.sh
          tar tzf backups/local-code-agent-backup-*.tar.gz
          tar tzf backups/local-code-agent-backup-*.tar.gz | grep -q 'env'
          tar tzf backups/local-code-agent-backup-*.tar.gz | grep -q 'models.txt'
          ./restore.sh
      - name: check-system.sh must exit 0 on this real install (webui disabled)
        run: |
          sudo apt-get install -y nftables
          ./check-system.sh
      - name: uninstall.sh removes the stack (and refuses without --yes)
        run: |
          if ./uninstall.sh </dev/null; then
            echo "uninstall must refuse non-interactive runs without --yes"; exit 1
          fi
          command -v ollama
          sudo ./uninstall.sh --yes
          if command -v ollama; then echo "ollama binary still present"; exit 1; fi
          test ! -e /etc/systemd/system/ollama.service.d
          test ! -e /etc/systemd/system/local-code-agent-tune.service
          test ! -e /etc/local-code-agent
          test ! -d .venv
          echo "uninstall verified"

  webui:
    name: E2E — Open WebUI container + volume backup/restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare .env
        run: cp .env.example .env
      - name: install_webui.sh for real (docker preinstalled on runners)
        run: scripts/install_webui.sh
      - name: webui.sh status must pass
        run: ./webui.sh status
      - name: Recreation from edited .env (port change) must take effect
        run: |
          sed -i 's/^WEBUI_PORT=.*/WEBUI_PORT=3210/' .env
          scripts/install_webui.sh
          curl -fsS --max-time 5 http://127.0.0.1:3210 >/dev/null
      - name: Volume-inclusive backup, destroy, restore — data must survive
        run: |
          sudo docker run --rm --entrypoint sh -v open-webui:/d \
            ghcr.io/open-webui/open-webui:main -c 'echo hello-backup > /d/ci-marker.txt'
          ./backup.sh
          tar tzf backups/local-code-agent-backup-*.tar.gz | grep -q 'open-webui-volume.tar.gz'
          sudo docker rm -f open-webui
          sudo docker volume rm open-webui
          ./restore.sh
          marker="$(sudo docker run --rm --entrypoint cat -v open-webui:/d \
            ghcr.io/open-webui/open-webui:main /d/ci-marker.txt)"
          test "${marker}" = "hello-backup"
          ./webui.sh status
      - name: webui.sh stop/start cycle
        run: |
          ./webui.sh stop
          ./webui.sh start
          sleep 5
          ./webui.sh status
